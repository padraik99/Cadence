<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cadence">
<title>Cadence Timer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0c0d10; --panel:#15171c; --panel2:#1c1f26; --line:#272b33;
  --text:#f2f3f5; --muted:#8b919c; --faint:#5a606b;
  --accent:#ff6b4a;
  --prep:#f5b94a; --warm:#a78bfa; --work:#ff6b4a; --rest:#34d399; --cool:#60a5fa; --count:#ff6b4a; --up:#e879f9;
  --r:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --shadow:none; --knob:0 1px 3px rgba(0,0,0,.3);
}
:root[data-theme="light"]{
  --bg:#f3f4f7; --panel:#ffffff; --panel2:#f3f4f7; --line:#e4e6eb;
  --text:#121418; --muted:#6b717c; --faint:#a0a6b0; --accent:#f2603e;
  --rest:#16b980; --prep:#e9a325;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f7; --panel:#ffffff; --panel2:#f3f4f7; --line:#e4e6eb;
    --text:#121418; --muted:#6b717c; --faint:#a0a6b0; --accent:#f2603e;
    --rest:#16b980; --prep:#e9a325;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);
  }
}
.card,.group,.ivl{box-shadow:var(--shadow)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.view{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.view.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(120px + var(--safe-b))}
.wrap{max-width:640px;margin:0 auto;width:100%}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;gap:12px;padding:calc(14px + var(--safe-t)) 16px 10px;max-width:672px;margin:0 auto;width:100%}
.hdr h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;flex:1}
.hdr h1 span{color:var(--accent)}
.hdr h2{font-size:17px;font-weight:600;margin:0;flex:1;text-align:center}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}
.txt-btn{height:44px;padding:0 14px;border-radius:22px;font-weight:600;color:var(--muted)}
.txt-btn.primary{color:var(--bg);background:var(--text)}

/* ---------- list ---------- */
.empty{color:var(--muted);text-align:center;margin-top:22vh;line-height:1.6}
.empty b{display:block;color:var(--text);font-size:20px;margin-bottom:4px}
.card{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent))}
.card .meta{flex:1;min-width:0}
.card .name{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:14px;color:var(--muted);margin-top:3px}
.card .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:700;margin-bottom:4px}
.play{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--c,var(--accent));color:#111;flex:none}
.play svg{width:22px;height:22px;margin-left:3px}
.fab{position:fixed;right:max(20px,calc(50% - 300px));bottom:calc(24px + var(--safe-b));width:68px;height:68px;border-radius:50%;
  background:var(--accent);color:#111;display:grid;place-items:center;box-shadow:0 10px 30px rgba(255,107,74,.35);z-index:5;transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:30px;height:30px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;align-items:flex-end;justify-content:center}
.scrim.on{display:flex;animation:fade .18s}
.sheet{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:640px;
  padding:10px 16px calc(20px + var(--safe-b));animation:up .22s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow-y:auto}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:4px 4px 12px;font-size:20px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:16px;background:var(--panel2);margin-bottom:10px;border:1px solid var(--line)}
.choice .dot{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);flex:none}
.choice .dot svg{width:22px;height:22px}
.choice b{display:block;font-size:17px}
.choice small{color:var(--muted);font-size:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}

/* ---------- forms ---------- */
.sec{margin:22px 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:700;padding-left:4px}
.group{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .lbl{flex:1;font-size:16px}
.row .lbl small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.name-in{flex:1;min-width:0;background:transparent;border:0;outline:0;font-size:16px;padding:10px 0}
.name-in::placeholder{color:var(--faint)}
.big-name{font-size:22px;font-weight:600}
.dur,.num{display:flex;align-items:center;background:var(--panel2);border-radius:12px;border:1px solid var(--line);flex:none}
.dur input{width:2.6ch;text-align:center;background:transparent;border:0;outline:0;font-size:17px;font-variant-numeric:tabular-nums;padding:8px 0}
.dur input.mm{text-align:right;width:3ch}
.dur input.ss{text-align:left}
.dur .colon{color:var(--muted);padding:0 1px}
.step,.num button{width:38px;height:40px;font-size:20px;color:var(--muted);display:grid;place-items:center}
.step:active,.num button:active{color:var(--text)}
.num span{min-width:2.4ch;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.tog{position:relative;width:52px;height:32px;flex:none}
.tog input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.tog span{position:absolute;inset:0;border-radius:16px;background:var(--line);transition:.2s}
.tog span::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s;box-shadow:var(--knob)}
.tog input:checked+span{background:var(--rest)}
.tog input:checked+span::after{transform:translateX(20px)}
.ivl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden}
.ivl .row{min-height:52px}
.ivl .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.ivl .x{width:36px;height:36px;flex:none;border-radius:50%;color:var(--faint);display:grid;place-items:center}
.ivl .x svg{width:16px;height:16px}
.add{width:100%;padding:16px;border-radius:var(--r);border:1.5px dashed var(--line);color:var(--muted);font-weight:600;margin-top:4px}
.danger{width:100%;padding:16px;border-radius:var(--r);color:#ff6b6b;background:var(--panel);border:1px solid var(--line);margin-top:26px;font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:18px 4px 0;color:var(--muted)}
.total b{color:var(--text);font-size:22px;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:32px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--line) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0}
.seg3{display:flex;background:var(--panel2);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg3 button{padding:8px 14px;border-radius:9px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg3 button.on{background:var(--text);color:var(--bg);font-weight:600}
.startbar{position:fixed;left:16px;right:16px;bottom:calc(16px + var(--safe-b));max-width:608px;margin:0 auto;height:64px;border-radius:20px;
  background:var(--text);color:var(--bg);display:flex;align-items:center;gap:14px;padding:0 22px;font-weight:700;font-size:18px;z-index:5;
  box-shadow:0 12px 30px rgba(0,0,0,.22);transition:transform .15s}
.startbar:active{transform:scale(.98)}
.startbar svg{width:18px;height:18px}
.startbar>span{flex:1;text-align:left;display:flex;flex-direction:column;line-height:1.15}
.startbar small{font-size:12px;font-weight:500;opacity:.55}
.startbar small:empty{display:none}
.startbar b{font-variant-numeric:tabular-nums;opacity:.55;font-weight:600}
.btnrow{display:flex;gap:10px;margin-top:26px}
.btnrow button{flex:1;padding:15px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);font-weight:600;box-shadow:var(--shadow)}
.btnrow .del{color:#e5484d}
.num input.ni{width:3.2ch;text-align:center;background:transparent;border:0;outline:0;font-size:17px;font-variant-numeric:tabular-nums;padding:8px 0}
.num .suf{font-style:normal;color:var(--muted);font-size:15px;margin:0 2px 0 -3px}
.sel{appearance:none;-webkit-appearance:none;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 30px 10px 12px;max-width:62%;font-size:15px;color:var(--text);
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:right 15px center,right 10px center;background-size:5px 5px;background-repeat:no-repeat}
.swipe{position:relative;margin:10px 0;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.swipe .card{margin:0;touch-action:pan-y;box-shadow:none}
.sw-bg{position:absolute;inset:0;display:flex;align-items:center;padding:0 24px;font-weight:700;color:#fff;gap:8px}
.sw-bg svg{width:20px;height:20px}
.swipe.l .sw-bg{background:#e5484d;justify-content:flex-end}
.swipe.r .sw-bg{background:var(--rest);justify-content:flex-start}
.swipe:not(.l) .sw-del,.swipe:not(.r) .sw-dup{display:none}
.swipe .sw-bg span{opacity:.55;transition:opacity .15s,transform .15s}
.swipe.arm .sw-bg span{opacity:1;transform:scale(1.08)}
.swipe-hint{color:var(--faint);font-size:13px;text-align:center;margin-top:18px}
.confirm-acts{display:flex;gap:10px;margin-top:18px}
.confirm-acts button{flex:1;padding:16px;border-radius:16px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.confirm-acts .del{background:#e5484d;color:#fff;border-color:#e5484d}
.note{color:var(--faint);font-size:13px;line-height:1.5;padding:10px 4px 0}
.nvrow{cursor:pointer}
.nvrow .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.nvrow.picked .radio{border-color:var(--rest)}
.nvrow.picked .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--rest)}
.nvrow.off .radio{opacity:.35}
.pill{height:36px;padding:0 13px;border-radius:18px;font-weight:600;font-size:14px;background:var(--panel2);border:1px solid var(--line);flex:none}
.pill.quiet{color:var(--muted);border-color:transparent;background:none;padding:0 6px}
.nvpct{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;flex:none}

/* ---------- run ---------- */
#run{background:#000;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;--c:var(--work)}
#run .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,color-mix(in srgb,var(--c) 34%,transparent),color-mix(in srgb,var(--c) 16%,transparent));transition:background .6s}
#run .glow{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 45%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);transition:background .6s}
#run .top{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding:calc(12px + var(--safe-t)) 16px 0}
#run .top .ttl{flex:1;text-align:center;color:rgba(255,255,255,.7);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#run .top .cnt{min-width:44px;text-align:right;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;font-size:15px;font-weight:600}
.hold{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08)}
.hold svg.i{width:18px;height:18px}
.hold svg.ring{position:absolute;inset:0;width:44px;height:44px;transform:rotate(-90deg)}
.hold circle{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:132;stroke-dashoffset:132}
.hold.charging circle{transition:stroke-dashoffset .7s linear;stroke-dashoffset:0}
#run .stage{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 12px;min-height:0}
#phase{font-size:clamp(22px,6.5vw,46px);font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--c);text-align:center;max-width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .4s}
#digits{font-weight:250;font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:.9;font-size:min(33vw,52vh);margin:2vh 0;white-space:nowrap;
  font-feature-settings:"tnum" 1,"ss01" 1;text-shadow:0 0 60px color-mix(in srgb,var(--c) 30%,transparent)}
#digits.long{font-size:min(23vw,44vh)}
#digits.short{font-size:min(64vw,58vh);letter-spacing:-.05em}
#digits.pulse{animation:pulse .5s}
@keyframes pulse{0%{transform:scale(1.04)}100%{transform:scale(1)}}
.prog{width:min(86vw,900px);height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--c);border-radius:3px;transition:background .4s}
#next{margin-top:3vh;color:rgba(255,255,255,.62);font-size:clamp(16px,4.4vw,24px);font-weight:500;text-align:center;min-height:1.3em}
#next b{color:#fff;font-weight:600}
#run .bottom{position:relative;z-index:2;padding:0 16px calc(22px + var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:14px;min-height:120px;justify-content:flex-end}
.hint{color:rgba(255,255,255,.4);font-size:14px;letter-spacing:.04em}
.ctrls{display:flex;align-items:center;gap:22px}
.ctrls button{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.ctrls button svg{width:26px;height:26px}
.ctrls .main{width:88px;height:88px;background:#fff;color:#000}
.ctrls .main svg{width:34px;height:34px}
#run.paused #digits,#run.prepping #digits{opacity:.6}
#run.paused #phase::after{content:" · paused";color:rgba(255,255,255,.55)}
.done{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:center;padding:24px}
.done.on{display:flex;animation:fade .4s}
.done .big{font-size:clamp(34px,9vw,64px);font-weight:700;letter-spacing:-.02em}
.done .stat{color:var(--muted);font-size:18px;font-variant-numeric:tabular-nums}
.done .acts{display:flex;gap:12px;margin-top:22px}
.done .acts button{padding:16px 28px;border-radius:30px;font-weight:700;font-size:17px;background:rgba(255,255,255,.12)}
.done .acts button.primary{background:#fff;color:#000}
.toast{position:fixed;left:50%;top:calc(16px + var(--safe-t));transform:translate(-50%,-30px);opacity:0;background:var(--text);color:var(--bg);font-weight:600;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.25);
  padding:12px 18px;border-radius:24px;font-size:14px;z-index:50;transition:.3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
@media (orientation:landscape) and (max-height:520px){
  #digits{font-size:min(30vw,62vh)} #next{margin-top:1vh} #run .bottom{min-height:84px;padding-bottom:calc(10px + var(--safe-b))}
  .ctrls button{width:52px;height:52px}.ctrls .main{width:68px;height:68px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ============ LIST ============ -->
<section id="list" class="view on">
  <header class="hdr">
    <h1>Cadence<span>.</span></h1>
    <button class="icon-btn" id="openSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>
  <div class="scroll"><div class="wrap" id="cards"></div></div>
  <button class="fab" id="fab" aria-label="Add timer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</section>

<!-- ============ EDIT ============ -->
<section id="edit" class="view">
  <header class="hdr">
    <button class="txt-btn" id="cancelEdit">Cancel</button>
    <h2 id="editTitle">New timer</h2>
    <button class="txt-btn primary" id="saveEdit">Save</button>
  </header>
  <div class="scroll"><div class="wrap" id="form"></div></div>
  <button class="startbar" id="startEdit"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg><span><span id="startLbl">Save &amp; start</span><small id="startHint"></small></span><b id="editTotal"></b></button>
</section>
<input type="file" id="importPick" accept="application/json,.json" hidden>

<!-- ============ RUN ============ -->
<section id="run" class="view">
  <div class="glow"></div>
  <div class="fill" id="fill"></div>
  <div class="top">
    <button class="hold" id="exitRun" aria-label="Hold to exit">
      <svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="21"/></svg>
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="ttl" id="runTitle"></div>
    <div class="cnt" id="runCount"></div>
  </div>
  <div class="stage">
    <div id="phase"></div>
    <div id="digits" class="short">0</div>
    <div class="prog"><i id="bar"></i></div>
    <div id="next"></div>
  </div>
  <div class="bottom" id="runBottom"></div>
  <div class="done" id="done">
    <div class="big">Workout complete</div>
    <div class="stat" id="doneStat"></div>
    <div class="acts">
      <button id="doneAgain">Again</button>
      <button class="primary" id="doneClose">Done</button>
    </div>
  </div>
</section>

<!-- ============ SHEETS ============ -->
<div class="scrim" id="addScrim">
  <div class="sheet" role="dialog" aria-label="Add timer">
    <div class="grab"></div>
    <h3>New timer</h3>
    <button class="choice" data-new="interval" style="--c:var(--work)">

<script>
"use strict";
/* =========================================================
   Utilities & storage
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = () => Math.random().toString(36).slice(2, 10);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}
function spokenDur(sec) {
  const m = Math.floor(sec / 60), s = sec % 60, out = [];
  if (m) out.push(m + (m === 1 ? " minute" : " minutes"));
  if (s) out.push(s + (s === 1 ? " second" : " seconds"));
  return out.join(" ");
}
let toastT;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600);
}

const ICON = {
  play:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.2" height="16" rx="1.2"/><rect x="13.8" y="4" width="4.2" height="16" rx="1.2"/></svg>',
  prev:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5.5v13a.8.8 0 0 1-1.25.66L9.5 12.66a.8.8 0 0 1 0-1.32l9.25-6.5A.8.8 0 0 1 20 5.5z"/></svg>',
  next:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5.5v13a.8.8 0 0 0 1.25.66l9.25-6.5a.8.8 0 0 0 0-1.32L5.25 4.84A.8.8 0 0 0 4 5.5z"/></svg>',
  copy:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
  x:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const KIND_COLOR = { prep:"var(--prep)", warm:"var(--warm)", work:"var(--work)", rest:"var(--rest)", cool:"var(--cool)", count:"var(--count)", up:"var(--up)" };
const TYPE_META = {
  interval:  { tag:"Intervals", c:"var(--work)" },
  countdown: { tag:"Countdown", c:"var(--prep)" },
  countup:   { tag:"Count up",  c:"var(--up)" }
};

/* =========================================================
   State
   ========================================================= */
const DEFAULT_SETTINGS = {
  volume: 0.8, voice: true, voiceLead: 3, beeps: true, haptics: true,
  tapAnywhere: true, keepAwake: true, headphoneDuck: true, music: false, playful: false, theme: "system", voiceURI: "", pace: "normal", tone: "natural",
  voiceMode: "phone", nvVoice: ""   // voiceMode "natural" = on-device neural voice (Piper), nvVoice = which one
};
let settings = { ...DEFAULT_SETTINGS, ...store.get("cadence.settings", {}) };
const saveSettings = () => store.set("cadence.settings", settings);

function newTimer(type) {
  const base = { id: uid(), type, name: "", prepare: 10 };
  if (type === "interval") return { ...base, warmup: { on: false, dur: 300, name: "" }, cooldown: { on: false, dur: 300, name: "" },
    work: [{ name: "", dur: 40, rest: 20, restName: "" }], restAfterLast: false, sets: 1, setRest: { on: false, dur: 60, name: "", hold: false } };
  const between = { on: false, dur: 30, name: "", hold: false };
  if (type === "countdown") return { ...base, duration: 60, repeat: 1, between };
  return { ...base, prepare: 0, hasTarget: false, target: 300, repeat: 1, between };
}
function samples() {
  const tab = newTimer("interval");
  tab.name = "Tabata"; tab.work = Array.from({ length: 8 }, () => ({ name: "", dur: 20, rest: 10, restName: "" }));
  const plank = newTimer("countdown"); plank.name = "Plank hold"; plank.duration = 60; plank.repeat = 3; plank.prepare = 5;
  return [tab, plank];
}
function normalize(t) {
  if (!t || !TYPE_META[t.type]) return null;
  const n = { ...newTimer(t.type), ...t };
  if (n.type === "interval") {
    n.warmup = { on: false, dur: 300, name: "", ...t.warmup }; n.cooldown = { on: false, dur: 300, name: "", ...t.cooldown };
    n.setRest = { on: false, dur: 60, name: "", hold: false, ...t.setRest };
    n.work = (Array.isArray(t.work) && t.work.length ? t.work : [{}]).map(w => ({ name: "", dur: 40, rest: 20, restName: "", ...w }));
  }
  else n.between = { on: false, dur: 30, name: "", hold: false, ...t.between };
  return n;
}
let timers = (store.get("cadence.timers", null) || samples()).map(normalize).filter(Boolean);
const saveTimers = () => store.set("cadence.timers", timers);

/* =========================================================
   Plan: timer definition -> list of segments
   ========================================================= */
/* a rest between rounds/sets: timed, or open-ended until tapped (then a 3 s "Get set") */
function restSegs(r, fallback) {
  const name = r.name || fallback;
  if (r.hold) return [{ kind: "rest", label: name, say: r.name || "Rest", cue: "Rest", dur: null, hold: true }, { kind: "prep", label: "Get set", dur: 3, auto: true }];
  return r.dur > 0 ? [{ kind: "rest", label: name, say: r.name || "Rest", cue: "Rest", dur: r.dur }] : [];
}
function buildPlan(t) {
  const segs = [];
  if (t.prepare > 0) segs.push({ kind: "prep", label: "Get ready", dur: t.prepare });
  let loopFrom = null;
  if (t.type === "interval") {
    if (t.warmup.on && t.warmup.dur > 0) segs.push({ kind: "warm", label: t.warmup.name || "Warm up", dur: t.warmup.dur });
    const sets = Math.max(1, t.sets || 1), n = t.work.length;
    for (let s = 0; s < sets; s++) {
      t.work.forEach((w, i) => {
        const setTag = sets > 1 ? `Set ${s + 1}/${sets}` : "";
        segs.push({ kind: "work", label: w.name || `Work ${i + 1}`, say: `Work ${i + 1}` + (w.name ? `: ${w.name}` : ""), cue: "Work", dur: w.dur, sub: setTag });
        const lastInSet = i === n - 1, last = s === sets - 1 && lastInSet;
        if (lastInSet && !last && t.setRest.on) segs.push(...restSegs(t.setRest, "Set rest"));
        else if (w.rest > 0 && (!last || t.restAfterLast)) segs.push({ kind: "rest", label: w.restName || `Rest ${i + 1}`, say: w.restName || "Rest", cue: "Rest", dur: w.rest, sub: setTag });
      });
    }
    if (t.cooldown.on && t.cooldown.dur > 0) segs.push({ kind: "cool", label: t.cooldown.name || "Cool down", dur: t.cooldown.dur });
  } else if (t.type === "countdown") {
    const n = t.repeat, rr = t.between.on ? t.between : null;
    if (n === 0) { loopFrom = segs.length; segs.push({ kind: "count", label: (t.name || "Round") + " #", dur: t.duration }); if (rr) segs.push(...restSegs(rr, "Rest")); }
    else for (let i = 0; i < n; i++) {
      segs.push({ kind: "count", label: n > 1 ? `Round ${i + 1}` : (t.name || "Countdown"), dur: t.duration });
      if (rr && i < n - 1) segs.push(...restSegs(rr, "Rest"));
    }
  } else {
    if (!t.hasTarget) segs.push({ kind: "up", label: t.name || "Count up", dur: null });
    else {
      const n = t.repeat, rr = t.between.on ? t.between : null;
      if (n === 0) { loopFrom = segs.length; segs.push({ kind: "up", label: "Round #", dur: t.target }); if (rr) segs.push(...restSegs(rr, "Rest")); }
      else for (let i = 0; i < n; i++) {
        segs.push({ kind: "up", label: n > 1 ? `Round ${i + 1}` : (t.name || "Count up"), dur: t.target });
        if (rr && i < n - 1) segs.push(...restSegs(rr, "Rest"));
      }
    }
  }
  return { segs, loopFrom };
}
function planTotal(plan) {
  if (plan.loopFrom != null || plan.segs.some(s => s.dur == null && !s.hold)) return null;
  return plan.segs.reduce((a, s) => a + (s.dur || 0), 0);
}
const fmtTotal = (plan, tot) => fmt(tot) + (plan.segs.some(s => s.hold) ? "+" : "");
function summary(t) {
  const plan = buildPlan(t), tot = planTotal(plan);
  let d;
  if (t.type === "interval") {
    const w = t.work, same = w.every(x => x.dur === w[0].dur && x.rest === w[0].rest);
    d = same ? `${w.length} × ${fmt(w[0].dur)}${w[0].rest ? " / " + fmt(w[0].rest) : ""}` : `${w.length} intervals`;
    if (t.sets > 1) d += ` · ${t.sets} sets`;
  } else if (t.type === "countdown") d = fmt(t.duration) + (t.repeat === 0 ? " · repeat ∞" : t.repeat > 1 ? ` × ${t.repeat}` : "");
  else d = t.hasTarget ? `to ${fmt(t.target)}` + (t.repeat === 0 ? " · repeat ∞" : t.repeat > 1 ? ` × ${t.repeat}` : "") : "Open-ended";
  return d + (tot != null && t.type !== "countdown" || (tot != null && t.repeat > 1) ? ` · ${fmtTotal(plan, tot)} total` : "");
}

/* =========================================================
   Views
   ========================================================= */
/* Every screen/sheet above the timer list is a "layer" with its own history entry,
   so the phone's Back button goes up one level instead of leaving the app.
   A layer's close function may return false to refuse (e.g. "discard changes?"). */
const layers = []; let histOK = true;
function pushLayer(fn) {
  layers.push(fn);
  try { history.pushState({ cadence: layers.length }, ""); } catch { histOK = false; }
}
function replaceLayer(fn) { if (layers.length) layers[layers.length - 1] = fn; else pushLayer(fn); }
function back() {
  if (!layers.length) return;
  if (histOK) return history.back();
  const fn = layers.pop(); if (fn() === false) layers.push(fn);
}
addEventListener("popstate", () => {
  const fn = layers.pop(); if (!fn) return;
  if (fn() === false) { layers.push(fn); try { history.pushState({ cadence: layers.length }, ""); } catch {} }
});
function show(id) { document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id)); }

function renderList() {
  const el = $("#cards");
  if (!timers.length) {
    el.innerHTML = `<div class="empty"><b>No timers yet</b>Tap <span style="color:var(--accent)">+</span> to build your first one.</div>`;
    return;
  }
  el.innerHTML = timers.map(t => {
    const m = TYPE_META[t.type];
    return `<div class="swipe" data-id="${t.id}"><div class="sw-bg">
      <span class="sw-dup">${ICON.copy} Duplicate</span><span class="sw-del">Delete ${ICON.trash}</span></div>
      <div class="card" data-id="${t.id}" style="--c:${m.c}">
      <div class="meta"><div class="tag">${m.tag}</div><div class="name">${esc(t.name || defaultName(t))}</div><div class="sub">${esc(summary(t))}</div></div>
      <button class="play" data-play="${t.id}" aria-label="Start ${esc(t.name || defaultName(t))}">${ICON.play}</button>
    </div></div>`;
  }).join("") + `<div class="swipe-hint">Swipe a timer ← to delete · → to duplicate</div>`;
}
const defaultName = t => ({ interval: "Interval timer", countdown: "Countdown", countup: "Count up" }[t.type]);

function confirmSheet(title, msg, ok = "Delete") {
  return new Promise(res => {
    const sc = $("#confScrim");
    $("#confSheet").innerHTML = `<div class="grab"></div><h3>${esc(title)}</h3><div style="color:var(--muted);padding:0 4px">${esc(msg)}</div>
      <div class="confirm-acts"><button data-c="0">Cancel</button><button class="del" data-c="1">${esc(ok)}</button></div>`;
    let val = false;
    sc.onclick = e => { const b = e.target.closest("[data-c]"); if (b) { val = b.dataset.c === "1"; back(); } };
    sc.classList.add("on");
    pushLayer(() => { sc.classList.remove("on"); sc.onclick = null; res(val); });
  });
}
function duplicateTimer(t) {
  const c = structuredClone(t); c.id = uid(); c.name = (t.name || defaultName(t)) + " copy";
  timers.splice(timers.findIndex(x => x.id === t.id) + 1, 0, c); saveTimers(); renderList(); toast("Duplicated");
  return c;
}
async function deleteTimer(t) {
  const ok = await confirmSheet(`Delete “${t.name || defaultName(t)}”?`, "This can't be undone. Export a backup in Settings if you might want it later.");
  if (ok) { timers = timers.filter(x => x.id !== t.id); saveTimers(); renderList(); toast("Timer deleted"); }
  return ok;
}
/* swipe: left = delete (confirmed), right = duplicate */
let sw = null, swiped = false;
$("#cards").addEventListener("pointerdown", e => {
  const c = e.target.closest(".card"); if (!c || e.target.closest(".play")) return;
  sw = { c, wrap: c.parentElement, x: e.clientX, y: e.clientY, dx: 0, lock: null, id: e.pointerId };
});
addEventListener("pointermove", e => {
  if (!sw || e.pointerId !== sw.id) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.lock) {
    if (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) { sw.lock = "x"; try { sw.c.setPointerCapture(e.pointerId); } catch {} }
    else if (Math.abs(dy) > 10) { sw = null; return; } else return;
  }
  const lim = sw.wrap.offsetWidth * 0.6, d = Math.max(-lim, Math.min(lim, dx));
  sw.dx = d; sw.c.style.transition = "none"; sw.c.style.transform = `translateX(${d}px)`;
  const armed = Math.abs(d) > 90;
  if (armed !== sw.wrap.classList.contains("arm")) buzz(15);
  sw.wrap.classList.toggle("l", d < 0); sw.wrap.classList.toggle("r", d > 0); sw.wrap.classList.toggle("arm", armed);
});
const swipeEnd = async e => {
  if (!sw || e.pointerId !== sw.id) return;
  const s = sw; sw = null; if (s.lock !== "x") return;
  swiped = true; setTimeout(() => swiped = false, 80);
  const t = timers.find(x => x.id === s.wrap.dataset.id), back = () => { s.c.style.transform = ""; s.wrap.classList.remove("arm"); };
  s.c.style.transition = "transform .28s cubic-bezier(.2,.8,.2,1)";
  if (s.dx < -90) { s.c.style.transform = "translateX(-100%)"; if (!(await deleteTimer(t))) back(); }
  else if (s.dx > 90) { back(); duplicateTimer(t); }
  else back();
};
addEventListener("pointerup", swipeEnd); addEventListener("pointercancel", swipeEnd);

$("#cards").addEventListener("click", e => {
  if (swiped) return;
  const p = e.target.closest("[data-play]");
  if (p) return startRun(timers.find(t => t.id === p.dataset.play));
  const c = e.target.closest(".card");
  if (c) openEdit(timers.find(t => t.id === c.dataset.id));
});
$("#fab").onclick = () => { $("#addScrim").classList.add("on"); pushLayer(() => $("#addScrim").classList.remove("on")); };
document.querySelectorAll(".scrim").forEach(s => s.addEventListener("click", e => { if (e.target === s) back(); }));
document.querySelectorAll("[data-new]").forEach(b => b.onclick = () => {
  $("#addScrim").classList.remove("on");
  openEdit(newTimer(b.dataset.new), true, "replace");
});

/* ---------------- Editor ---------------- */
let draft = null, draftIsNew = false, editSnap = "", editForce = false;
function editBack() {
  if (!editForce && JSON.stringify(draft) !== editSnap) {
    setTimeout(() => confirmSheet("Discard changes?", "Your edits to this timer won't be saved.", "Discard")
      .then(ok => { if (ok) { editForce = true; back(); } }), 0);
    return false;
  }
  editForce = false; show("list");
}
function openEdit(t, isNew = false, mode = "push") {
  draft = structuredClone(t); draftIsNew = isNew; editSnap = JSON.stringify(draft); editForce = false;
  $("#editTitle").textContent = isNew ? "New " + TYPE_META[t.type].tag.toLowerCase() : "Edit timer";
  $("#startLbl").textContent = isNew ? "Save & start" : "Run";
  $("#startHint").textContent = isNew ? "" : "doesn't save changes";
  renderEdit(); show("edit"); $("#edit .scroll").scrollTop = 0;
  if (mode === "push") pushLayer(editBack); else if (mode === "replace") replaceLayer(editBack);
}
const closeEdit = () => { editForce = true; back(); };
function getPath(o, p) { return p.split(".").reduce((a, k) => a?.[k], o); }
function setPath(o, p, v) { const ks = p.split("."), last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; }

function durHTML(path, sec) {
  return `<div class="dur" data-path="${path}">
    <button class="step" data-step="-1" aria-label="Less">−</button>
    <input class="mm" inputmode="numeric" pattern="[0-9]*" value="${Math.floor(sec / 60)}" aria-label="Minutes">
    <span class="colon">:</span>
    <input class="ss" inputmode="numeric" pattern="[0-9]*" value="${pad(sec % 60)}" aria-label="Seconds">
    <button class="step" data-step="1" aria-label="More">+</button></div>`;
}
function numHTML(path, v, min, max, suffix = "") {
  const shown = path === "repeat" && v === 0 ? "∞" : v;
  return `<div class="num" data-path="${path}" data-min="${min}" data-max="${max}">
    <button data-d="-1" aria-label="Less">−</button><input class="ni" inputmode="numeric" value="${shown}" aria-label="${path.replace("@", "")}">${suffix ? `<i class="suf">${suffix}</i>` : ""}<button data-d="1" aria-label="More">+</button></div>`;
}
function numVal(box) {
  const raw = box.querySelector(".ni").value.trim(), p = box.dataset.path;
  if (p === "repeat" && (raw === "∞" || raw === "0")) return 0;
  const n = parseInt(raw, 10); if (isNaN(n)) return null;
  return clamp(n, +box.dataset.min, +box.dataset.max);
}
function resizeWork(n) {
  while (draft.work.length < n) { const l = draft.work[draft.work.length - 1]; draft.work.push({ name: "", dur: l.dur, rest: l.rest, restName: "" }); }
  draft.work.length = n;
}
const PREP_STEPS = [0, 3, 5, 10, 15, 20, 30, 45, 60, 90, 120];
const togHTML = (path, on, rerender = true) =>
  `<label class="tog"><input type="checkbox" data-path="${path}" ${rerender ? 'data-rr="1"' : ""} ${on ? "checked" : ""}><span></span></label>`;

function restRows(path, r, title, small, ph) {
  let h = `<div class="row"><div class="lbl">${title}<small>${small}</small></div>${togHTML(path + ".on", r.on)}</div>`;
  if (!r.on) return h;
  h += `<div class="row"><div class="lbl">Ends</div><div class="seg3">
      <button data-hp="${path}.hold" data-hold="0" class="${r.hold ? "" : "on"}">Timed</button>
      <button data-hp="${path}.hold" data-hold="1" class="${r.hold ? "on" : ""}">When I tap</button></div></div>
    <div class="row"><span class="bar" style="width:4px;align-self:stretch;border-radius:2px;background:var(--rest)"></span>
      <input class="name-in" data-path="${path}.name" placeholder="${ph}" value="${esc(r.name)}" maxlength="30" aria-label="${ph} name">
      ${r.hold ? `<span style="color:var(--muted);font-size:14px;flex:none">until you tap</span>` : durHTML(path + ".dur", r.dur)}</div>`;
  return h;
}
function renderEdit() {
  const t = draft;
  let h = `<div class="group" style="margin-top:8px"><div class="row">
    <input class="name-in big-name" data-path="name" placeholder="${defaultName(t)}" value="${esc(t.name)}" maxlength="40" aria-label="Timer name"></div></div>`;

  h += `<div class="sec">Start</div><div class="group">
    <div class="row"><div class="lbl">Prepare<small>Get-ready countdown before starting</small></div>${numHTML("prepare", t.prepare, 0, 300, "s")}</div></div>`;

  if (t.type === "interval") {
    h += `<div class="sec">Warm up</div><div class="group">
      <div class="row"><div class="lbl">Warm up</div>${togHTML("warmup.on", t.warmup.on)}</div>
      ${t.warmup.on ? `<div class="row"><input class="name-in" data-path="warmup.name" placeholder="Warm up" value="${esc(t.warmup.name)}" maxlength="30">${durHTML("warmup.dur", t.warmup.dur)}</div>` : ""}
    </div>`;
    h += `<div class="sec">Intervals</div><div class="group">

/* =========================================================
   Audio: synthesized cues, voice, music ducking
   ========================================================= */
let ac = null, master = null, musicGain = null, musicSrc = null;
function ensureAudio() {
  try {
    if (navigator.audioSession) navigator.audioSession.type = "transient"; // play over other apps' audio, briefly ducking it (Safari 17+)
  } catch {}

    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.connect(ac.destination);
    musicGain = ac.createGain(); musicGain.connect(master);
  }

}
function applyVolume() {
  if (master) master.gain.setTargetAtTime(settings.volume, ac.currentTime, 0.02);
}
function bell(freq, t0, dur = 1.2, peak = 0.35, type = "sine") {
  const now = ac.currentTime + t0;

    const o = ac.createOscillator(), v = ac.createGain();
    o.type = tp; o.frequency.value = freq * mul;
    v.gain.setValueAtTime(0, now);
    v.gain.linearRampToValueAtTime(g, now + 0.008);
    v.gain.exponentialRampToValueAtTime(0.0001, now + dur / mul ** 0.5);
    o.connect(v); v.connect(master); o.start(now); o.stop(now + dur + 0.05);
  });
}

  ok: () => ac && settings.beeps && settings.volume > 0,
  pip()       { if (!this.ok()) return; bell(880, 0, 0.25, 0.32); },
  workStart() { if (!this.ok()) return; duck(1.2); bell(659.25, 0, 0.9, 0.3, "triangle"); bell(987.77, 0.11, 1.4, 0.32, "triangle"); },
  restStart() { if (!this.ok()) return; duck(1.2); bell(783.99, 0, 1.0, 0.26); bell(523.25, 0.16, 1.6, 0.26); },
  phase()     { if (!this.ok()) return; duck(1); bell(698.46, 0, 1.3, 0.28); },
  pause()     { if (!this.ok()) return; bell(440, 0, 0.18, 0.18); },
  finish()    { if (!this.ok()) return; duck(2.5); [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(f, i * 0.13, 1.8, 0.24, "triangle")); bell(1318.5, 0.6, 2.4, 0.16); }
};

let voices = [];

function englishVoices() {
  if (!("speechSynthesis" in window)) return [];
  return speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang))
    .sort((a, b) => accentOf(a).localeCompare(accentOf(b)) || a.name.localeCompare(b.name));
}

  if (settings.voiceURI) { const v = voices.find(v => v.voiceURI === settings.voiceURI); if (v) return v; }
  const en = voices.filter(v => /^en(-|_|$)/i.test(v.lang));
  const pref = [/premium|enhanced|natural|neural/i, /samantha|ava|allison|serena|daniel|karen|moira/i, /google us english|google uk english female/i];
  for (const r of pref) { const v = en.find(v => r.test(v.name)); if (v) return v; }

const hasTTS = "speechSynthesis" in window;

function speak(text, delay = 0) {

    else if (s.kind === "up") { txt = fmt(Math.min(R.el, s.dur)); prog = R.el / s.dur; }
    else { const r = Math.ceil(Math.max(0, s.dur - R.el - 0.001)); txt = r < 60 ? String(r) : fmt(r); prog = R.el / s.dur; }
    if (d.textContent !== txt) { d.textContent = txt; d.classList.toggle("long", txt.length > 5); d.classList.toggle("short", !txt.includes(":")); }
    prog = clamp(prog, 0, 1);
    $("#bar").style.width = (prog * 100).toFixed(2) + "%";
    $("#fill").style.height = (prog * 100).toFixed(2) + "%";
  }
  requestAnimationFrame(frame);
}
function togglePause() {
  if (!R || R.done || !R.started) return;
  R.running = !R.running; R.last = performance.now();
  run.classList.toggle("paused", !R.running);
  sfx.pause(); buzz(R.running ? 60 : [40, 60, 40]);
  if (R.running) { holdWake(); musicPlay(); } else { musicPause(); stopSpeech(); }
  renderBottom();
}
function skip(d) {
  if (!R || R.done || !R.started) return;
  if (d > 0) return advance(0);
  if (R.el > 2 || R.i === 0) { R.el = 0; R.fired = new Set(); return; }
  R.i--; R.el = 0; enterSeg();
}
function renderBottom() {
  const b = $("#runBottom");
  if (!R || R.done) { b.innerHTML = ""; return; }
  if (!R.started) { b.innerHTML = `<div class="hint">Tap to start now · the phone voice covers any line that isn't ready</div>`; return; }
  const paused = !R.running;
  if (seg().hold && !paused) {
    b.innerHTML = `<div class="ctrls"><button class="main" data-act="next" aria-label="I'm ready">${ICON.play}</button></div>
      <div class="hint">${settings.tapAnywhere ? "Tap anywhere when you're ready" : "Tap ▶ when you're ready"}</div>`;
    return;
  }
  if (settings.tapAnywhere && !paused) { b.innerHTML = `<div class="hint">Tap anywhere to pause</div>`; return; }
  b.innerHTML = `<div class="ctrls">
    <button data-act="prev" aria-label="Previous">${ICON.prev}</button>
    <button class="main" data-act="toggle" aria-label="${paused ? "Resume" : "Pause"}">${paused ? ICON.play : ICON.pause}</button>
    <button data-act="next" aria-label="Skip">${ICON.next}</button></div>
    ${paused && settings.tapAnywhere ? `<div class="hint">Tap anywhere to resume · hold ✕ to end</div>` : paused ? `<div class="hint">Hold ✕ to end</div>` : ""}`;
}
run.addEventListener("pointerdown", e => {
  if (!R || R.done) return;
  const btn = e.target.closest("button");
  if (btn) return;
  if (!R.started) { e.preventDefault(); return R.go(); }
  if (!settings.tapAnywhere) return;
  e.preventDefault();
  if (seg().hold && R.running) advance(0); else togglePause();
});
$("#runBottom").addEventListener("click", e => {
  const a = e.target.closest("[data-act]")?.dataset.act;
  if (a === "toggle") togglePause(); else if (a === "prev") skip(-1); else if (a === "next") skip(1);
});

/* hold-to-exit: needs a 0.7s press while running so a stray tap can't end a workout */
const ex = $("#exitRun"); let exT = null;
ex.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (!R || R.done || !R.started) return endRun();
  ex.classList.add("charging");
  exT = setTimeout(endRun, 700);
});
["pointerup", "pointerleave", "pointercancel"].forEach(ev => ex.addEventListener(ev, () => { clearTimeout(exT); ex.classList.remove("charging"); }));
function teardownRun() {
  clearTimeout(exT); ex.classList.remove("charging");
  clearInterval(loopId);
  stopSpeech(); keepAlive(false);
  dropWake(); musicPause(); unduck();
  run.classList.remove("paused", "prepping");
  const from = R?.from || "list"; R = null; return from;
}
/* Back during a workout: first press pauses, second press leaves */
function runBack() {
  if (!runForce && R && !R.done && R.running && R.started) { togglePause(); toast("Paused · press Back again to exit"); return false; }
  runForce = false; show(teardownRun());
}
function endRun() { runForce = true; back(); }
$("#doneClose").onclick = endRun;
$("#doneAgain").onclick = () => { const t = R.t, f = R.from; teardownRun(); startRun(t, "none", f); };

/* keyboard: space = pause, arrows = skip, esc = exit */
document.addEventListener("keydown", e => {
  if (!run.classList.contains("on") || !R) return;
  if (!R.started) { if (e.code === "Escape") endRun(); else if (e.code === "Space") { e.preventDefault(); R.go(); } return; }
  if (e.code === "Space") { e.preventDefault(); togglePause(); }
  else if (e.code === "ArrowRight") skip(1);
  else if (e.code === "ArrowLeft") skip(-1);
  else if (e.code === "Escape") endRun();
});

function applyTheme() {
  const r = document.documentElement;
  if (settings.theme === "system") delete r.dataset.theme; else r.dataset.theme = settings.theme;
  const light = settings.theme === "light" || (settings.theme === "system" && matchMedia("(prefers-color-scheme: light)").matches);
  document.querySelector('meta[name="theme-color"]').content = light ? "#f3f4f7" : "#0c0d10";
}
matchMedia("(prefers-color-scheme: light)").addEventListener?.("change", applyTheme);
function exportTimers() {
  const blob = new Blob([JSON.stringify({ app: "cadence", version: 1, timers }, null, 2)], { type: "application/json" });
  const a = document.createElement("a"), d = new Date();
  a.href = URL.createObjectURL(blob); a.download = `cadence-timers-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$("#importPick").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const list = (Array.isArray(data) ? data : data.timers || []).map(normalize).filter(Boolean).map(t => ({ ...t, id: uid() }));
    if (!list.length) return toast("No timers found in that file");
    timers.push(...list); saveTimers(); renderList(); renderSettings();
    toast(`Imported ${list.length} timer${list.length > 1 ? "s" : ""}`);
  } catch { toast("Couldn't read that file"); }
};
applyTheme();
renderList();
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
